<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Micro Livraria</title>
        <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" />
        <link rel="stylesheet" href="https://unpkg.com/bulma@0.9.0/css/bulma.min.css" />
        <link rel="stylesheet" type="text/css" href="index.css" />
        <link rel="stylesheet" href="https://unpkg.com/bulma-modal-fx/dist/css/modal-fx.min.css" />
    </head>
    <body>
        <section class="hero is-info is-small">
            <div class="hero-body">
                <div class="container has-text-centered">
                    <p class="title">Micro Livraria</p>
                </div>
            </div>
        </section>
        <div class="box cta">
            <p class="has-text-centered">Uma simples livraria utilizando microservices</p>
        </div>
        <section class="container">
            <div class="columns books"></div>
        </section>

        <!-- Modal de Avaliações -->
        <div class="modal" id="reviews-modal">
            <div class="modal-background" id="reviews-modal-bg"></div>
            <div class="modal-card reviews-modal-card">
                <header class="modal-card-head reviews-modal-head">
                    <div class="reviews-modal-header-content">
                        <span class="reviews-modal-icon">⭐</span>
                        <div>
                            <p class="modal-card-title reviews-modal-title" id="reviews-modal-title">Avaliações</p>
                            <p class="reviews-modal-subtitle" id="reviews-modal-subtitle"></p>
                        </div>
                    </div>
                    <button class="delete is-medium" aria-label="fechar" id="reviews-modal-close"></button>
                </header>
                <section class="modal-card-body reviews-modal-body" id="reviews-modal-body">
                    <!-- conteúdo injetado via JS -->
                </section>
                <footer class="modal-card-foot reviews-modal-foot">
                    <button class="button reviews-close-btn" id="reviews-modal-close-btn">Fechar</button>
                </footer>
            </div>
        </div>

        <footer class="footer has-text-centered">Feito com ❤️ na UFMG</footer>

        <script src="https://unpkg.com/bulma-modal-fx/dist/js/modal-fx.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/overlayscrollbars/1.9.1/js/OverlayScrollbars.min.js"></script>
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
        <script src="index.js"></script>
    </body>
</html>
